<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo-icon.png" type="image/x-icon">
</head>
<body>
  <div class="top-logo">
    <img src="logo.png" alt="Logo">
  </div>
  <div class="main-container">
    <div class="input-section">
      <h1 class="brand-title">Create your QR Code</h1>
      <p class="subtitle">Generate a QR Code for anything!</p>
      <input type="text" placeholder="https://example.com or enter text" name="input_text" id="input_text" autocomplete="off">
      <div class="error-message" id="error-message"></div>
      <button class="btn-primary" type="submit">Generate</button>
    </div>
    <div class="result-section">
      <div class="qr-image">
        <div class="qr-placeholder">
          <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="20" width="80" height="80" fill="#E2E8F0" stroke="#D1D5DB" stroke-width="2"/>
            <rect x="30" y="30" width="20" height="20" fill="#9CA3AF"/>
            <rect x="70" y="30" width="20" height="20" fill="#9CA3AF"/>
            <rect x="30" y="70" width="20" height="20" fill="#9CA3AF"/>
            <rect x="70" y="70" width="20" height="20" fill="#9CA3AF"/>
            <rect x="50" y="50" width="20" height="20" fill="#D1D5DB"/>
            <rect x="30" y="50" width="20" height="20" fill="#D1D5DB"/>
            <rect x="50" y="30" width="20" height="20" fill="#D1D5DB"/>
          </svg>
          <p>Your QR will appear here.</p>
        </div>
      </div>
    </div>
  </div>
  <footer class="footer-credits">
    <div class="divider-line"></div>
    
    <div class="footer-name">
      Developed by Sarthak Tyagi
    </div>

    <div class="social-links">
      <a href="https://github.com/aslivashu" target="_blank" class="social-link" title="Visit GitHub">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.66-3.795-1.455-3.795-1.455-.54-1.38-1.335-1.755-1.335-1.755-1.095-.75.075-.735.075-.735 1.215.09 1.845 1.245 1.845 1.245 1.08 1.86 2.805 1.32 3.495 1.005.105-.78.42-1.32.765-1.62-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405 1.02 0 2.04.135 3 .405 2.28-1.56 3.285-1.245 3.285-1.245.675 1.65.255 2.88.135 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.285 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub
      </a>

      <a href="https://www.linkedin.com/in/sarthaktyagi2236999" target="_blank" class="social-link" title="Connect on LinkedIn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 21.227.792 22 1.771 22h20.451C23.2 22 24 21.227 24 20.271V1.729C24 .774 23.2 0 22.225 0z"/></svg>
        LinkedIn
      </a>
    </div>
    
    <p style="font-size: 0.8rem; opacity: 0.8;">
      Making the web more accessible, one QR at a time.
    </p>
  </footer>
  <script src="qrcode.min.js"></script>  
  <script src="script.js"></script>
</body>
</html>
